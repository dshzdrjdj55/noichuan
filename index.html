<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nói Chuẩn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1a8cff;--ok:#16794a;--okb:#22c55e;--bad:#dc2626;--warn:#d97706;--card:#e9eaee;--ink:#14163a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#fff;min-height:100vh;
  background:
    radial-gradient(circle at 12% 6%,rgba(120,85,60,.55),transparent 32%),
    radial-gradient(circle at 88% 14%,rgba(105,50,140,.6),transparent 38%),
    radial-gradient(circle at 22% 42%,rgba(30,70,150,.55),transparent 38%),
    radial-gradient(circle at 62% 55%,rgba(60,80,100,.45),transparent 32%),
    #15132e;background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
.app{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 24px}
.nav{display:flex;align-items:center;height:60px;position:relative}
.nav h1{position:absolute;left:0;right:0;text-align:center;font-size:19px;font-weight:700;pointer-events:none}
.nav .back{font-size:24px;width:40px;height:40px;z-index:1;text-align:left}
.lang{margin-left:auto;z-index:1;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.search{margin-top:8px;display:flex;align-items:center;border:1.5px solid rgba(255,255,255,.2);border-radius:14px;padding:0 6px 0 16px;background:rgba(255,255,255,.04)}
.search:focus-within{border-color:rgba(255,255,255,.55)}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font:500 17px inherit;font-family:inherit;padding:15px 0}
.search input::placeholder{color:rgba(255,255,255,.45)}
.search .clr{font-size:20px;color:rgba(255,255,255,.75);width:40px;height:40px;display:none}
.search .clr.on{display:block}
.spin{width:20px;height:20px;margin:0 10px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
.spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.chips .lab{width:100%;font-size:13px;color:rgba(255,255,255,.55);font-weight:600}
.chips button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600}
.spacer{flex:1;min-height:20px}
.card{background:var(--card);color:var(--ink);border-radius:26px;padding:22px 20px 18px;display:none}
.card.on{display:block}
.top{display:flex;align-items:center;gap:10px}
.word{flex:1;font-size:36px;font-weight:600;line-height:1.2;word-wrap:break-word;min-width:0}
.word.sm{font-size:24px}
.w{transition:color .3s}
.w.ok{color:var(--ok)}.w.mid{color:var(--warn)}.w.bad{color:var(--bad)}
.score{display:none;align-items:center;gap:6px;font-weight:800;font-size:22px;flex:none}
.score.on{display:flex}
.score i{width:24px;height:24px;border-radius:50%;border:3.5px solid currentColor}
.hr{height:1.5px;background:#d3d5dc;margin:14px 0}
.ipa{font-size:20px;font-weight:500;min-height:24px}
.vi{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:16px;color:#3a3d5c;min-height:22px}
.sec{position:relative}
.sec h4{font-size:14px;font-weight:700;margin-bottom:3px}
.sec p{font-size:14px;color:#2b2e4a;line-height:1.45;margin-bottom:10px}
.sec .tr{position:absolute;right:0;top:0;font-size:18px;color:#3a3d5c;width:32px;height:32px}
.sec .tr.on{color:var(--blue)}
.sec .pvi{color:#5b5f80;font-style:italic}
.hintln{font-size:14px;color:#3a3d5c;margin-bottom:6px}
.tl{color:#2563eb;font-weight:800}.tn{color:#ea580c;font-weight:800}
.acts{display:flex;align-items:center;gap:22px;margin-top:6px}
.acts button{color:var(--blue);line-height:0}
.acts button.dim{color:#9aa0b4}
.acts .bm{margin-left:auto}.acts .bm.on{color:#f59e0b}
.fb{display:none;margin-top:12px;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.fb.on{display:block}
.fb.good{background:#dcfce7;color:#14532d}.fb.badc{background:#fee2e2;color:#7f1d1d}.fb.ask{background:#fff;color:#334155}
.yn{display:flex;gap:10px;margin-top:10px}
.yn button{flex:1;padding:12px;border-radius:12px;font-size:15px;font-weight:800}
.yn .y{background:var(--okb);color:#fff}.yn .n{background:#fff;color:var(--bad);border:2px solid #fecaca}
.tap{text-align:center;margin:14px 0 12px;font-size:16px;color:rgba(255,255,255,.8);font-weight:500;min-height:24px}
.micwrap{display:flex;justify-content:center}
.mic{width:76px;height:76px;border-radius:20px;background:var(--blue);display:grid;place-items:center;transition:.2s}
.mic svg{width:34px;height:34px}
.mic:disabled{opacity:.35}
.mic.rec{background:repeating-linear-gradient(135deg,#1a8cff 0 10px,#3aa0ff 10px 20px);background-size:28px 28px;animation:st .6s linear infinite;box-shadow:0 0 0 6px rgba(26,140,255,.25)}
@keyframes st{to{background-position:28px 0}}
.note{margin-top:16px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.75);background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;display:none}
.note.on{display:block}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:#fff;color:var(--ink);
  padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s;z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}

.w.tapw{cursor:pointer;border-bottom:2px dotted currentColor}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:7}
.bd.on{opacity:1;pointer-events:auto}
.ps{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:#fff;color:var(--ink);border-radius:24px 24px 0 0;
  transform:translateY(105%);transition:transform .3s;z-index:8;max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.ps.on{transform:none}
.ps .hd{width:44px;height:5px;border-radius:5px;background:#d4d6dc;margin:10px auto 6px;flex:none}
.ps .head{display:flex;align-items:center;gap:14px;padding:12px 20px 14px;flex:none}
.ps .head .wd{font-size:32px;font-weight:700;color:var(--ink)}
.ps .head button{color:var(--blue);line-height:0}
.ps .sc{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700}
.ps .sc .rg{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#f1e4e8 0);display:grid;place-items:center}
.ps .sc .rg::after{content:"";width:34px;height:34px;border-radius:50%;background:#fff}
.tblw{overflow-y:auto;padding:0 16px 20px}
table.ph{width:100%;border-collapse:separate;border-spacing:0;border:1.5px solid #e2e3e8;border-radius:16px;overflow:hidden;font-size:15px}
table.ph th{background:#f1ede4;text-align:left;padding:13px 14px;font-weight:700;font-size:15px}
table.ph td{padding:14px;border-top:1.5px solid #e9eaee;vertical-align:top}
table.ph th+th,table.ph td+td{border-left:1.5px solid #e9eaee}
table.ph td:first-child{width:38%}
.pr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pr b{font-size:22px;font-weight:500}
.pr button{color:var(--blue);line-height:0}
.okt{color:var(--ok);font-weight:800;font-size:18px}
.badt{color:var(--bad);font-size:22px;font-weight:500}
.tipt{margin-top:6px;color:#3a3d5c;line-height:1.45;font-size:14px}
.exw{display:block;margin-top:6px;font-size:13px;color:#6b7089;font-weight:600}
.psnote{font-size:13px;color:#6b7089;padding:10px 4px 0;line-height:1.45}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <button class="back" id="back" aria-label="Quay lại">←</button>
    <h1>Từ điển</h1>
    <button class="lang" id="lang">🇬🇧 Anh</button>
  </div>

  <div class="search">
    <input id="q" type="text" placeholder="Tìm kiếm từ, cụm từ" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div class="spin" id="spin"></div>
    <button class="clr" id="clr" aria-label="Xoá">✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
  <div class="spacer"></div>

  <div class="card" id="card">
    <div class="top"><div class="word" id="word"></div><div class="score" id="score"><i></i><span id="scoreTxt"></span></div></div>
    <div class="hr"></div>
    <div class="ipa" id="ipa"></div>
    <div class="vi" id="vi"></div>
    <div id="more"></div>
    <div class="acts">
      <button id="spk" aria-label="Nghe"><svg width="36" height="28" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11h7l9-7v24l-9-7H3z"/><path d="M26 11c2 2.5 2 7.5 0 10M31 7c4 4.5 4 13.5 0 18"/></svg></button>
      <button id="slow" aria-label="Nghe chậm"><svg width="40" height="28" viewBox="0 0 46 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 27h22c3 0 5-2 5-5V12a9 9 0 1 0-18 0c0 3 2 6 6 6s5-3 5-5-1-4-3-4"/><path d="M30 22c3 0 4-3 4-6M27 8l1-4M31 9l3-3"/><path d="M38 12c1.5 1.5 1.5 5 0 6.5M42 9c3 3.5 3 9 0 12.5"/></svg></button>
      <button class="bm" id="bm" aria-label="Lưu"><svg width="28" height="30" viewBox="0 0 34 36" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M18 8H3v26l11-9 11 9V19"/><path d="M27 2v12M21 8h12"/></svg></button>
    </div>
    <div class="fb" id="fb"></div>
  </div>

  <div class="tap" id="tap">Chạm để Nói</div>
  <div class="micwrap"><button class="mic" id="mic" aria-label="Nói" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
  </button></div>
</div>
<div class="bd" id="bd"></div>
<div class="ps" id="ps"><div class="hd"></div><div class="head" id="psHead"></div><div class="tblw" id="psBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SUG={en:["different","comfortable","vegetable","world","think","thirteen","necessary","pronunciation"],
           vi:["la","na","lo","no","lên","nên","nước","làng","lo lắng","năng lực","Nồi đồng nấu ốc"]};
let LANG="en",cur="",info=null,state="idle",rec=null,showTr=false;
let saved={en:[],vi:[]};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem("nc4saved")||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem("nc4saved",JSON.stringify(saved))}catch(e){}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micOff=!SR;
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFC").toLowerCase().replace(/[.,!?;:"“”()–]/g," ").replace(/’/g,"'").split(/\s+/).filter(Boolean);
const isL=w=>w[0]==="l", isN=w=>w[0]==="n"&&w[1]!=="g"&&w[1]!=="h";

/* ---------- Claude (khi mở trong app Claude) ---------- */
let samp=null;
if(window.claude&&claude.use){claude.use("sample").then(s=>{samp=s}).catch(()=>{})}

/* ---------- tra từ ---------- */
const cache={};
async function lookup(word){
  const k=LANG+":"+word.toLowerCase();if(cache[k])return cache[k];
  let r=null;
  if(LANG==="vi"){r={ipa:"/"+norm(word).join(" ")+"/",vi:null};cache[k]=r;return r}
  // 1) Từ điển công khai (chạy khi mở bằng trình duyệt)
  try{
    const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));
    if(res.ok){const j=await res.json(),e=j[0];
      const ipa=e.phonetic||(e.phonetics.find(p=>p.text)||{}).text||"";
      let def="",ex="";
      for(const m of e.meanings){for(const d of m.definitions){if(!def)def=d.definition;if(d.example&&!ex){ex=d.example;if(!def)def=d.definition}}}
      const au=e.phonetics.find(p=>p.audio&&/-us\./.test(p.audio))||e.phonetics.find(p=>p.audio);
      r={ipa,def,ex,audio:au?au.audio:""};
      try{const t=await fetch("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(word));const tj=await t.json();r.vi=tj.responseData&&tj.responseData.translatedText}catch(e){}
    }
  }catch(e){}
  // 2) Hỏi Claude (khi mở trong app Claude)
  if(!r&&samp){
    try{r=await samp.json(`You are an English-Vietnamese learner's dictionary. For the English word or phrase below, reply with JSON only, no prose:
{"ipa":"/IPA with stress mark, US/","vi":"short Vietnamese meaning","def":"short simple English definition","ex":"short natural example sentence","def_vi":"Vietnamese translation of def","ex_vi":"Vietnamese translation of ex"}
If it is not a real English word or phrase, return {"ipa":"","vi":"","def":"","ex":""}.
Word: ${word}`,{modelTier:"quick"})}catch(e){r=null}
  }
  if(!r)r={ipa:"",vi:"",def:"",ex:""};
  cache[k]=r;return r;
}

/* ---------- hiển thị ---------- */
function renderChips(){
  const s=saved[LANG],h=[];
  if(s.length)h.push(`<div class="lab">Đã lưu</div>`,...s.map(w=>`<button data-w="${esc(w)}">★ ${esc(w)}</button>`));
  h.push(`<div class="lab" style="margin-top:4px">Gợi ý</div>`,...SUG[LANG].map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`));
  $("chips").innerHTML=h.join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.w;go()});
}
function paintWord(st){
  const ws=cur.split(/\s+/);
  $("word").className="word"+(cur.length>16?" sm":"");
  $("word").innerHTML=ws.map((w,k)=>`<span class="w ${st?st[k]||"":""}">${esc(w)}</span>`).join(" ");
}
function renderCard(){
  $("card").classList.add("on");paintWord();
  $("score").classList.remove("on");$("fb").className="fb";
  $("ipa").textContent=info.ipa||"";
  if(LANG==="vi"){
    const t=norm(cur),hl=t.some(isL),hn=t.some(isN);
    $("vi").innerHTML=(hl?`<span class="tl">L</span> hơi ra miệng`:"")+(hl&&hn?" &nbsp;·&nbsp; ":"")+(hn?`<span class="tn">N</span> hơi ra mũi`:"")||"🇻🇳 Tiếng Việt";
    $("more").innerHTML="";
  }else{
    $("vi").innerHTML=info.vi?`<span>🇻🇳</span><span>${esc(info.vi)}</span>`:"";
    let m="";
    if(info.def||info.ex){
      m=`<div class="hr"></div><div class="sec">`+(info.def_vi||info.vi?`<button class="tr ${showTr?"on":""}" id="tr" aria-label="Dịch">文A</button>`:"");
      if(info.def)m+=`<h4>Định nghĩa</h4><p>${esc(info.def)}${showTr&&info.def_vi?`<br><span class="pvi">${esc(info.def_vi)}</span>`:""}</p>`;
      if(info.ex)m+=`<h4>Ví dụ</h4><p>${esc(info.ex)}${showTr&&info.ex_vi?`<br><span class="pvi">${esc(info.ex_vi)}</span>`:""}</p>`;
      m+=`</div>`;
    }
    $("more").innerHTML=m;
    if($("tr"))$("tr").onclick=()=>{
      if(!info.def_vi){toast("Chưa có bản dịch cho phần này");return}
      showTr=!showTr;const st=$("score").classList.contains("on");renderCard();if(st)restoreScore();
    };
  }
  $("bm").classList.toggle("on",saved[LANG].includes(cur));
  $("mic").disabled=false;
}
let lastScore=null;
function restoreScore(){if(lastScore)showScore(...lastScore)}

let reqId=0;
async function go(blur){
  const v=$("q").value.trim();if(!v)return;
  if(v===cur&&info&&info.ipa!==undefined&&!blur&&$("card").classList.contains("on")&&!$("spin").classList.contains("on"))return;
  if(blur!==false)$("q").blur();stopMic();cur=v;showTr=false;lastScore=null;
  const id=++reqId;$("spin").classList.add("on");$("clr").classList.remove("on");
  info={ipa:"",vi:""};renderCard();
  const r=await lookup(v);if(id!==reqId)return;
  info=r;$("spin").classList.remove("on");$("clr").classList.add("on");renderCard();
}

/* ---------- nghe mẫu ---------- */
function voice(){try{const vs=speechSynthesis.getVoices(),p=LANG==="en"?/^en[-_]US/i:/^vi/i;return vs.find(v=>p.test(v.lang))||vs.find(v=>v.lang.startsWith(LANG))||null}catch(e){return null}}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
function speak(rate){
  if(!cur)return;
  if(LANG==="en"&&info&&info.audio){playSrc(info.audio,rate<.7?.65:1);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur);u.lang=LANG==="en"?"en-US":"vi-VN";const v=voice();if(v)u.voice=v;u.rate=rate;
    if(!v&&LANG==="vi")toast("Máy chưa có giọng tiếng Việt");speechSynthesis.speak(u)}catch(e){toast("Không phát được âm thanh")}
}
$("spk").onclick=()=>speak(LANG==="en"?.9:.85);
$("slow").onclick=()=>speak(.5);
$("bm").onclick=()=>{const s=saved[LANG],i=s.indexOf(cur);if(i>=0){s.splice(i,1);toast("Đã bỏ lưu")}else{s.unshift(cur);s.length=Math.min(s.length,30);toast("Đã lưu ★")}
  persist();$("bm").classList.toggle("on",s.includes(cur));renderChips()};

/* ---------- micro + chấm điểm ---------- */
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length);
function setMic(rec,label){$("mic").classList.toggle("rec",rec);$("tap").textContent=label}
function stopMic(){if(state==="wrec"&&wRec){try{wRec.onstop=null;wRec.stop();wStream.getTracks().forEach(t=>t.stop())}catch(e){}clearTimeout(wTimer)}if(rec){try{rec.onresult=rec.onend=rec.onerror=null;rec.abort()}catch(e){}rec=null}state="idle";setMic(false,"Chạm để Nói")}
function blocked(){
  micOff=true;rec=null;
  $("note").innerHTML="🎙️ Trong app Claude, micro bị chặn nên máy chưa tự chấm được. Bạn hãy <b>mở file này bằng Chrome trên máy tính</b> để được chấm điểm tự động. Tạm thời bạn có thể đọc to rồi tự chấm.";
  $("note").classList.add("on");
  state="reading";setMic(true,"Bắt đầu đọc… đọc xong chạm lại");
}

/* ---------- chế độ Whisper: ghi âm + nhận diện ngay trong trình duyệt (cho Chrome trên iPhone) ---------- */
let useWhisper=false,asrP=null,wRec=null,wStream=null,wTimer=null,lastRecURL=null;
const TJS="https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.min.js";
function loadASR(){
  if(!asrP)asrP=(async()=>{
    const T=await import(TJS);T.env.allowLocalModels=false;
    const files={};
    return await T.pipeline("automatic-speech-recognition","Xenova/whisper-tiny.en",{dtype:"q8",device:"wasm",
      progress_callback:p=>{if(p.status==="progress"&&p.total){files[p.file]=[p.loaded,p.total];let a=0,b=0;Object.values(files).forEach(([l,t])=>{a+=l;b+=t});
        if(state!=="wrec")$("tap").textContent=`Đang tải bộ nghe giọng (lần đầu)… ${Math.round(a/b*100)}%`}}});
  })().catch(e=>{asrP=null;throw e});
  return asrP;
}
async function wStart(){
  try{wStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){blocked();return}
  loadASR().catch(()=>{});
  const chunks=[];wRec=new MediaRecorder(wStream);
  wRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  wRec.onstop=async()=>{
    clearTimeout(wTimer);wStream.getTracks().forEach(t=>t.stop());
    state="busy";setMic(false,"Đang nghe lại giọng bạn…");$("mic").disabled=true;
    try{
      const blob=new Blob(chunks,{type:wRec.mimeType||"audio/mp4"});
      if(lastRecURL)URL.revokeObjectURL(lastRecURL);lastRecURL=URL.createObjectURL(blob);
      const ac=new (window.AudioContext||window.webkitAudioContext)();
      const dec=await ac.decodeAudioData(await blob.arrayBuffer());try{ac.close()}catch(e){}
      const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(dec.duration*16000)),16000);
      const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
      const pcm=(await off.startRendering()).getChannelData(0);
      const asr=await loadASR();
      $("tap").textContent="Đang chấm điểm…";
      const out=await asr(pcm);
      const text=(out&&out.text||"").replace(/\[.*?\]|\(.*?\)/g,"").trim();
      state="idle";$("mic").disabled=false;setMic(false,"Chạm để Nói");
      if(!text){$("tap").textContent="Chưa nghe rõ, chạm để nói lại";return}
      await gradeEN([{t:text,c:.85}]);
    }catch(e){
      state="idle";$("mic").disabled=false;setMic(false,"Có lỗi khi nhận diện, chạm để thử lại");
    }
  };
  wRec.start();state="wrec";setMic(true,"Bắt đầu đọc… đọc xong chạm lại");
  wTimer=setTimeout(()=>{if(state==="wrec")wRec.stop()},7000);
}
$("mic").onclick=()=>{
  if(!cur)return;
  if(state==="listening"){try{rec.stop()}catch(e){}return}
  if(state==="wrec"){try{wRec.stop()}catch(e){}return}
  if(state==="busy")return;
  if(state==="reading"){state="idle";setMic(false,"Chạm để Nói");askSelf();return}
  $("score").classList.remove("on");$("fb").className="fb";paintWord();try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(useWhisper&&LANG==="en"){wStart();return}
  if(micOff){state="reading";setMic(true,"Bắt đầu đọc… đọc xong chạm lại");return}
  rec=new SR();rec.lang=LANG==="en"?"en-US":"vi-VN";rec.interimResults=false;rec.maxAlternatives=5;
  let got=false;
  rec.onstart=()=>{state="listening";setMic(true,"Bắt đầu đọc")};
  rec.onresult=e=>{got=true;const r=e.results[0],al=[...r].map(a=>({t:a.transcript,c:a.confidence||.85}));LANG==="en"?gradeEN(al):grade(al)};
  rec.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error))blocked()};
  rec.onend=()=>{if(state==="listening"){state="idle";setMic(false,got?"Chạm để Nói":"Chưa nghe rõ, chạm để nói lại")}rec=null};
  try{rec.start()}catch(e){blocked()}
};
function grade(alts){
  const tw=norm(cur);let best=null;
  alts.forEach((a,ai)=>{
    const h=norm(a.t);let tot=0,err=null;
    const st=tw.map(w=>{
      let b=0,bw="";h.forEach(x=>{const s=sim(w,x);if(s>b){b=s;bw=x}});
      if(LANG==="vi"&&b<1&&(isL(w)||isN(w))&&h.includes(isL(w)?"n"+w.slice(1):"l"+w.slice(1))){b=0;if(!err)err=[w,isL(w)?"n"+w.slice(1):"l"+w.slice(1)]}
      tot+=b;return b>=.99?"ok":b>=.7?"mid":"bad";
    });
    const conf=ai===0?a.c:a.c*.9;
    let sc=Math.round(tot/tw.length*(0.82+0.18*Math.min(1,conf))*100);
    if(st.every(s=>s==="ok"))sc=Math.max(sc,85);
    sc=Math.min(100,sc);
    if(!best||sc>best.sc)best={sc,st,err,t:a.t};
  });
  showScore(best.sc,best.st,best.err,best.t);
}
function showScore(sc,st,err,heard){
  lastScore=[sc,st,err,heard];
  paintWord(st);
  const col=sc>=80?"var(--ok)":sc>=50?"var(--warn)":"var(--bad)";
  $("score").style.color=col;$("scoreTxt").textContent=sc+"%";$("score").classList.add("on");
  const fb=$("fb");
  if(sc>=80){fb.className="fb on good";fb.innerHTML="<b>Tuyệt vời!</b> Phát âm rất chuẩn."}
  else if(err){fb.className="fb on badc";fb.innerHTML=`<b>Bạn đang nói thành "${esc(err[1])}".</b> `+(isL(err[0])?"Âm L: hơi ra miệng, bịt mũi vẫn nói được.":"Âm N: hơi ra mũi, sống mũi rung.")}
  else{fb.className="fb on badc";fb.innerHTML="<b>Chưa chuẩn.</b> Nghe mẫu 🔊 rồi thử lại các phần màu đỏ/cam."}
  if(heard)fb.innerHTML+=`<div style="opacity:.7;font-size:13px;margin-top:4px">Máy nghe được: “${esc(heard)}”</div>`;
}
function askSelf(){
  const fb=$("fb");fb.className="fb on ask";
  fb.innerHTML=`<b>Bạn đọc giống giọng mẫu chưa?</b> Bấm 🔊 nghe lại để so sánh.<div class="yn"><button class="n" id="no">👎 Chưa</button><button class="y" id="yes">👍 Giống rồi</button></div>`;
  const n=norm(cur).length;
  $("yes").onclick=()=>showScore(100,Array(n).fill("ok"),null,"");
  $("no").onclick=()=>showScore(0,Array(n).fill("bad"),null,"");
}

const MULTI=["tʃ","dʒ","eɪ","aɪ","ɔɪ","aʊ","oʊ","əʊ","ɪə","eə","ʊə"];
function tok(ipa){
  let s=(ipa||"").replace(/[\/\[\]ˈˌ.()‿ʰ̩̃]/g,"").replace(/ɡ/g,"g").replace(/ɹ/g,"r").replace(/ɫ/g,"l").replace(/ɝ/g,"ɜ").replace(/ɐ/g,"ʌ").replace(/ɾ/g,"t").replace(/ʔ/g,"t").replace(/ᵻ/g,"ɪ").replace(/\s+/g,"");
  const out=[];let i=0;
  while(i<s.length){let m=MULTI.find(x=>s.startsWith(x,i));let t=m||s[i];i+=t.length;if(s[i]==="ː"){t+="ː";i++}out.push(t)}
  return out;
}
function canon(p){p=p.replace("ː","");return {e:"ɛ","əʊ":"oʊ","ɒ":"ɑ"}[p]??p}

/* so âm mục tiêu với âm nghe được; âm thừa gắn vào âm đứng trước (vd /ə n/) */
function alignPh(T,H){
  const m=T.length,n=H.length,D=[...Array(m+1)].map((_,i)=>[...Array(n+1)].map((_,j)=>i?(j?0:i):j));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+sc2(T[i-1],H[j-1]));
  const res=T.map(()=>({h:[]}));let i=m,j=n;const extra=[];
  const near=(a,b)=>Math.abs(a-b)<1e-9;
  while(i>0||j>0){
    if(i>0&&j>0&&near(D[i][j],D[i-1][j-1]+sc2(T[i-1],H[j-1]))){res[i-1].h.unshift(H[j-1],...extra.splice(0));i--;j--}
    else if(i>0&&near(D[i][j],D[i-1][j]+1)){if(extra.length){res[i-1].h.push(...extra.splice(0))}i--}
    else{extra.unshift(H[j-1]);j--}
  }
  if(extra.length&&res.length)res[0].h.unshift(...extra);
  return T.map((t,k)=>{
    const h=res[k].h;let st;
    if(h.length===1&&key2(h[0])===key2(t))st="ok";
    else if(!h.length)st="bad";
    else if(h.some(x=>key2(x)===key2(t))||isV(h[0])===isV(t))st="near";
    else st="bad";
    return{t,h,st};
  });
}

["th",["θ"],["ð"]],["sh",["ʃ"]],["ch",["tʃ"],["k"],["ʃ"]],["ph",["f"]],["ng",["ŋ"],["ŋ","g"]],["ck",["k"]],["wh",["w"]],["gh",["g"],["f"]],["kn",["n"]],["wr",["r"]],["mb",["m"]],["qu",["k","w"],["k"]],
["ee",["iː"]],["ea",["iː"],["ɛ"],["eɪ"]],["ie",["iː"],["aɪ"]],["ei",["eɪ"],["iː"]],["ey",["eɪ"],["iː"]],["ai",["eɪ"]],["ay",["eɪ"]],["oa",["oʊ"]],["oo",["uː"],["ʊ"]],["ou",["aʊ"],["uː"],["ʌ"],["ə"]],["ow",["aʊ"],["oʊ"]],
["oi",["ɔɪ"]],["oy",["ɔɪ"]],["au",["ɔ"]],["aw",["ɔ"]],["ue",["uː"]],["ew",["uː"]],["er",["ɚ"],["ɜ"],["ə","r"],["ɛ","r"]],["ir",["ɜ"],["ɚ"],["ɪ","r"]],["ur",["ɜ"],["ɚ"],["ʊ","r"]],["or",["ɚ"],["ɔ","r"]],["ar",["ɑ","r"],["ɚ"]],
["x",["k","s"],["g","z"]],["a",["æ"],["eɪ"],["ə"],["ɑ"],["ɔ"],["ɛ"]],["e",["ɛ"],["iː"],["ə"],["ɪ"]],["i",["ɪ"],["aɪ"],["ə"],["iː"]],["o",["ɑ"],["oʊ"],["ə"],["ʌ"],["ɔ"],["uː"],["ʊ"]],
["u",["ʌ"],["uː"],["ʊ"],["ə"],["j","uː"]],["y",["j"],["ɪ"],["aɪ"],["iː"]],["c",["k"],["s"]],["g",["g"],["dʒ"]],["n",["n"],["ŋ"]],["s",["s"],["z"],["ʃ"]],["t",["t"],["ʃ"]],["q",["k"]],["j",["dʒ"]],["d",["d"],["t"]]];
function spans(word,P){
  const L=word.toLowerCase(),n=L.length,m=P.length,Pk=P.map(key2),INF=1e9;
  const C=[...Array(n+1)].map(()=>Array(m+1).fill(INF)),B=[...Array(n+1)].map(()=>Array(m+1).fill(null));C[0][0]=0;
  const rel=(i,j,ni,nj,c,info)=>{if(ni<=n&&nj<=m&&C[i][j]+c<C[ni][nj]){C[ni][nj]=C[i][j]+c;B[ni][nj]=[i,j,info]}};
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    if(C[i][j]>=INF)continue;
    for(const [g,...seqs] of G){if(!L.startsWith(g,i))continue;
      for(const sq of seqs){if(sq.every((p,k)=>Pk[j+k]===p))rel(i,j,i+g.length,j+sq.length,-.01*(g.length-1),"m")}}
    if(i<n&&j<m&&L[i]===Pk[j])rel(i,j,i+1,j+1,0,"m");
    if(i<n)rel(i,j,i+1,j,1,"s");
    if(j<m)rel(i,j,i,j+1,1.5,"p");
    if(i<n&&j<m)rel(i,j,i+1,j+1,1.2,"m");
  }
  const own=Array(n).fill(-1);let i=n,j=m;
  while(i>0||j>0){const [pi,pj,t]=B[i][j];if(t==="m"){for(let k=pi;k<i;k++)own[k]=j-1}i=pi;j=pj}
  for(let k=0;k<n;k++)if(own[k]<0)own[k]=k>0?own[k-1]:-1;
  for(let k=n-1;k>=0;k--)if(own[k]<0)own[k]=k<n-1?own[k+1]:0;
  return own;
}
function lettersHTML(word,rows){
  if(!rows||!rows.length)return esc(word);
  const own=spans(word,rows.map(r=>r.t)),cls={ok:"ok",near:"mid",bad:"bad"};
  return [...word].map((ch,k)=>{const r=rows[own[k]];return `<span class="w ${r?cls[r.st]:""}">${esc(ch)}</span>`}).join("");
}
const ipaCache={},audCache={};
async function ipaOf(w){
  w=w.toLowerCase().replace(/[^a-z']/g,"");if(!w)return "";
  if(ipaCache[w]!==undefined)return ipaCache[w];
  let r="";
  try{const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
    if(res.ok){const e=(await res.json())[0];const us=e.phonetics.find(p=>p.text&&/-us\./.test(p.audio||""));const au=e.phonetics.find(p=>p.audio&&/-us\./.test(p.audio))||e.phonetics.find(p=>p.audio);if(au)audCache[w]=au.audio;r=(us&&us.text)||e.phonetic||(e.phonetics.find(p=>p.text)||{}).text||""}}catch(e){}
  if(!r&&samp){try{const j=await samp.json(`Reply with JSON only: {"ipa":"/US IPA/"} for the English word: ${w}`,{modelTier:"quick"});r=j.ipa||""}catch(e){}}
  ipaCache[w]=r;return r;
}
function alignWords(T,H){
  const m=T.length,n=H.length,c=(a,b)=>1-sim(a,b),D=[...Array(m+1)].map((_,i)=>[...Array(n+1)].map((_,j)=>i?(j?0:i):j));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+c(T[i-1],H[j-1]));
  const res=Array(m).fill(null);let i=m,j=n;
  while(i>0&&j>0){
    if(Math.abs(D[i][j]-(D[i-1][j-1]+c(T[i-1],H[j-1])))<1e-9){res[i-1]=H[j-1];i--;j--}
    else if(Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){i--}else j--;
  }
  return res;
}

/* số -> chữ (Whisper hay viết "13" thay vì "thirteen") */
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],
TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function n2w(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");if(n<1000)return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+n2w(n%100):"");return String(n)}
const numWords=t=>t.replace(/\d+/g,d=>n2w(+d));
/* đoán phiên âm cho từ không có trong từ điển (vd máy nghe thành "fing") */
function guessPh(w){
  w=w.toLowerCase();const out=[];let i=0;
  while(i<w.length){
    const hit=G.find(([g])=>w.startsWith(g,i));
    if(hit){out.push(...hit[1]);i+=hit[0].length}
    else{if(/[bdfhklmnprtvwz]/.test(w[i]))out.push(w[i]);i++}
  }
  if(out.length>1&&w.endsWith("e")&&!/[aeiou]e$/.test(w)&&out[out.length-1]==="ɛ")out.pop();
  return out;
}
let wordRes=[];
async function gradeEN(alts){
  const raw=cur.split(/\s+/),T=raw.map(w=>w.toLowerCase().replace(/[^a-z']/g,""));
  let best=alts[0],bs=-1;
  alts.forEach(a=>{const h=norm(numWords(a.t)),al=alignWords(T,h);let s=0;al.forEach((x,i)=>{if(x)s+=sim(T[i],x)});if(s>bs){bs=s;best=a}});
  const H=norm(numWords(best.t)).map(w=>w.replace(/[^a-z']/g,"")),al=alignWords(T,H),conf=Math.min(1,best.c||.85);
  $("tap").textContent="Đang phân tích…";
  wordRes=await Promise.all(T.map(async(w,i)=>{
    const h=al[i],tP=tok(await ipaOf(w)),base={w:raw[i],h};
    if(h===w)return{...base,sc:Math.round(88+12*conf),rows:tP.map(t=>({t,h:[t],st:"ok"}))};
    if(!h)return{...base,sc:0,rows:tP.map(t=>({t,h:[],st:"bad"}))};
    if(!tP.length)return{...base,sc:Math.round(sim(w,h)*60),rows:[]};
    let hP=tok(await ipaOf(h));
    if(!hP.length)hP=guessPh(h);
    if(!hP.length)return{...base,sc:Math.round(sim(w,h)*60),rows:tP.map(t=>({t,h:["?"],st:"bad"}))};
    const rows=alignPh(tP,hP),pts=rows.reduce((a,r)=>a+(r.st==="ok"?1:r.st==="near"?.5:0),0);
    return{...base,sc:Math.round(pts/rows.length*92*(.9+.1*conf)),rows};
  }));
  const total=Math.round(wordRes.reduce((a,r)=>a+r.sc,0)/wordRes.length);
  $("tap").textContent="Chạm để Nói";
  showScore(total,null,null,best.t);
  // tô màu từng chữ cái và cho phép chạm vào từng từ
  $("word").innerHTML=wordRes.map((r,i)=>`<span class="wt" data-i="${i}">${lettersHTML(r.w,r.rows)}</span>`).join(" ");
  $("word").querySelectorAll(".wt").forEach(el=>{if(wordRes.length>1){el.classList.add("tapw");el.style.cursor="pointer"}el.onclick=()=>openPS(+el.dataset.i)});
  const worst=wordRes.reduce((a,r,i)=>r.sc<wordRes[a].sc?i:a,0);
  if(wordRes.length===1||wordRes[worst].sc<80)openPS(worst);
  if(wordRes.length>1)$("fb").innerHTML+=`<div style="margin-top:4px;font-size:13px">👉 Chạm vào từng từ để xem chi tiết từng âm.</div>`;
}
function sayText(t,rate){const k=t.toLowerCase();if(audCache[k]&&!rate){playSrc(audCache[k]);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";const v=voice();if(v)u.voice=v;u.rate=rate||.85;speechSynthesis.speak(u)}catch(e){}}
const SPK=`<svg width="30" height="26" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11h7l9-7v24l-9-7H3z"/><path d="M26 11c2 2.5 2 7.5 0 10M31 7c4 4.5 4 13.5 0 18"/></svg>`;
function openPS(i){
  const r=wordRes[i];if(!r)return;
  const col=r.sc>=80?"var(--ok)":r.sc>=50?"#f97316":"var(--bad)";
  $("psHead").innerHTML=`<span class="wd">${lettersHTML(r.w,r.rows)}</span><button id="psSpk" aria-label="Nghe">${SPK}</button>${lastRecURL&&useWhisper?`<button id="psMe" aria-label="Nghe lại giọng bạn" style="font-size:24px">🗣️</button>`:""}
    <div class="sc" style="color:${col}"><div class="rg" style="--p:${r.sc};--c:${col}"></div>${r.sc}%</div>`;
  $("psSpk").onclick=()=>sayText(r.w);
  if($("psMe"))$("psMe").onclick=()=>playSrc(lastRecURL);
  let b="";
  if(!r.rows.length){b=`<p class="psnote">Không tìm được phiên âm của từ này nên chưa phân tích từng âm được.${r.h?` Máy nghe được: “${esc(r.h)}”.`:""}</p>`}
  else{
    b=`<table class="ph"><tr><th>Âm thanh</th><th>Bạn đã nói</th></tr>`+r.rows.map(x=>{
      const tk=key2(x.t),ex=PH_EX[tk];
      const left=`<div class="pr"><b>/${esc(x.t)}/</b><button data-ph="${esc(x.t)}" aria-label="Nghe âm">${SPK}</button></div>${ex?`<button class="exw" data-ex="${ex}">vd: ${ex} 🔊</button>`:""}`;
      let right;
      if(x.st==="ok")right=`<span class="okt">Chính xác</span>`;
      else{
        const said=x.h.length?x.h.join(" "):"—",canPlay=x.h.length&&x.h.every(p=>PH_AUDIO[key2(p)]);
        const c=x.st==="near"?"#f97316":"var(--bad)";
        const lead=!x.h.length?"Bạn chưa phát âm âm này. ":x.h.length>1?`Bạn đọc thành nhiều âm (/${esc(said)}/) thay vì một âm /${esc(x.t)}/. `:"";
        right=`<div class="pr"><span class="badt" style="color:${c}">/${esc(said)}/</span><button ${canPlay?`data-ph="${esc(x.h.join("|"))}"`:"disabled"} style="${canPlay?"":"color:#b8bcc8"}" aria-label="Nghe âm bạn nói">${SPK}</button></div><div class="tipt">${lead}${PH_TIP[tk]||""}</div>`;
      }
      return `<tr><td>${left}</td><td>${right}</td></tr>`;
    }).join("")+`</table>`;
    b+=`<p class="psnote">${r.h&&r.h!==r.w.toLowerCase()?`Máy nghe được: “${esc(r.h)}”. `:""}🔊 cột trái: nghe âm đúng. 🔊 cột phải: nghe âm bạn đã nói.</p>`;
  }
  $("psBody").innerHTML=b;
  $("psBody").querySelectorAll("[data-ex]").forEach(el=>el.onclick=()=>sayText(el.dataset.ex));
  $("psBody").querySelectorAll("[data-ph]").forEach(el=>el.onclick=()=>playPh(el.dataset.ph.split("|")));
  $("bd").classList.add("on");$("ps").classList.add("on");
}
